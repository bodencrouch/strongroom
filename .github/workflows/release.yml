name: Release
# Builds unsigned installers on tagged pushes (v*) and attaches them to a GitHub
# Release in this repository. Nothing is published anywhere else.
# A manual run (workflow_dispatch) builds the artifacts but does not create a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match apps/desktop version $version" >&2; exit 1; }
      - run: pnpm run check
      - run: pnpm run build

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The macOS build is best effort: it is unsigned and the native AutoFill extension
    # may need Apple signing assets this repository does not have. A failure there must
    # not block the Linux and Windows installers.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            script: package:linux
            experimental: false
          - name: Windows
            runner: windows-latest
            script: package:win
            experimental: false
          - name: macOS
            runner: macos-latest
            script: package:mac
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package (unsigned)
        run: pnpm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  extensions:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extension:zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-browser-extensions
          path: |
            apps/extension/.output/*.zip
            !apps/extension/.output/*safari*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter strongroom run build
      # Writes a tarball only. This does not publish it.
      - run: mkdir -p ../../release && npm pack --pack-destination ../../release
        working-directory: apps/cli
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli
          path: release/strongroom-*.tgz
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extensions, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "Strongroom $TAG" \
            --notes-file .github/release-notes.md
